name: android-launch

# Installs the EU APK on an Android emulator and checks that it starts and
# keeps running (without a ROM it waits on the ROM picker).

on:
  push:
    branches: [main]
    paths: ['android/**', 'port/**', 'CMakeLists.txt', '.github/workflows/android-launch.yml']
  workflow_dispatch:

jobs:
  launch:
    name: Android emulator launch test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon assembleEuRelease
      - name: Inspect native libraries
        run: |
          ndk=$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin
          for abi in arm64-v8a x86_64; do
            for lib in $(find android/app/build/intermediates -path "*euRelease*/$abi/*.so" | grep -E "lib(game|main)\.so" | sort -u); do
              echo "=== $lib"
              ls -l "$lib"
              $ndk/llvm-readelf -l -d "$lib" | grep -E "LOAD|TEXTREL|NEEDED|FLAGS|GNU_RELRO" || true
            done
          done
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/android-launch.sh
