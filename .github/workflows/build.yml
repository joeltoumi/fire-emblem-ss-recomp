name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux (headless smoke test, ${{ matrix.region }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        region: [us, eu]
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build lld
      - name: Configure
        # clang, like the Android NDK: it rejects implicit declarations, GCC does not.
        run: cmake -B build -G Ninja -DFE8_HOST=headless -DFE8_REGION=${{ matrix.region }} -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER=clang
      - name: Build
        run: cmake --build build
      - name: Smoke test (no game data)
        # The game can't run without the player's ROM, so CI only checks that
        # the engine starts and refuses a file that isn't Fire Emblem.
        run: |
          head -c 16777216 /dev/zero > zero.gba
          if ./build/fe8_headless --rom zero.gba --frames 10 --dump-every 0 > out.txt 2>&1; then
            cat out.txt; echo "a zero-filled ROM was accepted"; exit 1
          fi
          cat out.txt
          grep -q "ROM rejected" out.txt

  appimage:
    name: Linux / Steam Deck AppImage (${{ matrix.region }})
    # The oldest supported runner, so the AppImage runs on older glibc too.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        region: [eu, us]
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        # SDL3's headers for X11, Wayland, audio and gamepads (it loads the
        # libraries themselves at run time, from the player's system).
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build lld clang \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libdecor-0-dev libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dev libdrm-dev \
            libgbm-dev libdbus-1-dev libibus-1.0-dev libudev-dev libasound2-dev \
            libpulse-dev libpipewire-0.3-dev libusb-1.0-0-dev
      - name: Configure
        run: >
          cmake -B build -G Ninja -DFE8_HOST=sdl -DFE8_REGION=${{ matrix.region }}
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DSDL_STATIC=ON -DSDL_SHARED=OFF
      - name: Build
        run: cmake --build build
      - name: Package
        run: |
          curl -sSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 APPIMAGETOOL=$PWD/appimagetool \
            packaging/linux/build-appimage.sh build "Fire_Emblem_Sacred_Stones-${{ matrix.region }}-x86_64.AppImage"
      - uses: actions/upload-artifact@v6
        with:
          name: fe8-linux-appimage-${{ matrix.region }}
          path: Fire_Emblem_Sacred_Stones-*.AppImage
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Build APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee gradle.log
      - name: Report build errors
        if: failure()
        working-directory: android
        # Surface the end of the log as an annotation (readable from the API).
        run: |
          {
            grep -nE "error|Error|FAILED|What went wrong" gradle.log | tail -40
            echo "----- tail -----"
            tail -60 gradle.log
          } > summary.txt || true
          msg=$(sed -e 's/%/%25/g' summary.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=Android build log::${msg}"
      - uses: actions/upload-artifact@v6
        with:
          name: fe8-android-apk
          path: android/app/build/outputs/apk/*/release/*.apk
          if-no-files-found: error
