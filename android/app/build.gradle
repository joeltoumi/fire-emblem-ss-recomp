plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.fe8.android'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'dev.fe8.android'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '0.1.1'

        externalNativeBuild {
            cmake {
                arguments "-DFE8_HOST=sdl",
                          "-DANDROID_STL=c++_static", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
            }
        }
        ndk {
            // The AYN Thor and every current phone are 64-bit ARM; x86_64 is
            // for the emulator.
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    // One APK per ROM region: the game code differs between versions
    // (#ifdef REGION_*), so each build only accepts its own dump. The
    // application ids differ, so all of them can be installed side by side.
    flavorDimensions 'region'
    productFlavors {
        eu {
            dimension 'region'
            applicationIdSuffix '.eu'
            resValue 'string', 'app_name', 'FE Sacred Stones (EU)'
            externalNativeBuild {
                cmake {
                    arguments '-DFE8_REGION=eu'
                }
            }
        }
        us {
            dimension 'region'
            resValue 'string', 'app_name', 'FE Sacred Stones (US)'
            externalNativeBuild {
                cmake {
                    arguments '-DFE8_REGION=us'
                }
            }
        }
    }

    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version '3.22.1+'
        }
    }

    signingConfigs {
        release {
            if (System.getenv('ANDROID_KEYSTORE')) {
                storeFile file(System.getenv('ANDROID_KEYSTORE'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            // Signed with the release keystore when CI provides one (see
            // .github/workflows/build.yml), otherwise with the debug key.
            signingConfig System.getenv('ANDROID_KEYSTORE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            // Extracted to disk: libgame.so is loaded by the launcher at a
            // reserved address (android_dlopen_ext).
            useLegacyPackaging true
        }
    }

    lint {
        abortOnError false
    }
}
